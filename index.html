<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>PaperNote</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PaperNote">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="data:application/manifest+json;base64,eyJuYW1lIjoiUGFwZXJOb3RlIiwic2hvcnRfbmFtZSI6IlBhcGVyTm90ZSIsImRpc3BsYXkiOiJzdGFuZGFsb25lIiwiYmFja2dyb3VuZF9jb2xvciI6IiNmZmZmZmYiLCJ0aGVtZV9jb2xvciI6IiM0ZjZiZmYiLCJzdGFydF91cmwiOiIuIiwib3JpZW50YXRpb24iOiJwb3J0cmFpdCJ9">
<style>
  :root {
    --bg: #ffffff; --bg2: #f4f4f6; --bg3: #e6e6ea; --text: #1c1c1e; --text2: #6b6b70;
    --text3: #a0a0a5; --border: #e3e3e6; --accent: #4f6bff; --red: #ff3b30;
    --green: #16794f; --active: #84cc16; --active-on: #1c1c1e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --bg2: #1c1c1e; --bg3: #131315; --text: #f5f5f7; --text2: #98989d;
      --text3: #6b6b70; --border: #2c2c2e; --accent: #7b8fff; --red: #ff453a;
      --green: #4ade9e; --active: #a6e22e; --active-on: #1c1c1e;
    }
  }
  * { box-sizing: border-box; }
  html {
    height: 100%;
    overscroll-behavior: none;
  }
  /* iOS has no real orientation-lock API (Screen Orientation's lock() isn't
     implemented in Safari, and the manifest's orientation:"portrait" is
     ignored by iOS home-screen web apps) — this counter-rotates the whole
     page back to portrait whenever the device reports landscape, which is
     the only approach that actually works there. Scoped to touch-primary
     devices (hover:none/pointer:coarse) so a resized PC browser window,
     which also matches "orientation: landscape", is never affected. */
  @media screen and (orientation: landscape) and (hover: none) and (pointer: coarse) {
    html {
      transform: rotate(-90deg);
      transform-origin: left top;
      width: 100vh;
      height: 100vw;
      overflow: hidden;
      position: absolute;
      top: 100%;
      left: 0;
    }
  }
  body {
    margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    position: fixed; inset: 0; overscroll-behavior: none;
    padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 0.5px solid var(--border); flex: 0 0 auto;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; }
  .iconBtn {
    background: none; border: none; color: var(--text2); cursor: pointer;
    padding: 6px 4px; line-height: 1; display: flex; align-items: center;
  }
  main { flex: 1; display: flex; flex-direction: column; padding: 12px 14px; gap: 10px; min-height: 0; }
  main[hidden] { display: none; }
  #modeTabs { display: flex; gap: 0; border: 1px solid var(--border); flex: 0 0 auto; }
  #modeTabs button {
    flex: 1; min-width: 0; background: var(--bg2); color: var(--text2); border: none;
    padding: 13.5px 4px; font-size: 19.5px; font-weight: 500; cursor: pointer;
    border-right: 0.5px solid var(--border);
  }
  #modeTabs button:last-child { border-right: none; }
  #modeTabs button.on { background: var(--active); color: var(--active-on); }
  #panels { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .panel { flex: 1; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .panel[hidden] { display: none; }
  textarea {
    flex: 1; width: 100%; resize: none; border: 1px solid var(--border);
    border-radius: 0; padding: 10px 12px; font-size: 22.5px; line-height: 1.4;
    background: var(--bg2); color: var(--text); font-family: inherit;
  }
  textarea:focus { outline: none; }
  #fileNoteInput {
    flex: 0 0 auto; width: 100%; border: 1px solid var(--border); border-radius: 0;
    padding: 15px 12px; font-size: 22.5px; background: var(--bg2); color: var(--text);
    font-family: inherit;
  }
  #fileNoteInput:focus { outline: none; }
  #pasteBtn {
    flex: 0 0 auto; background: var(--bg2); color: var(--text2); border: 1px solid var(--border);
    border-radius: 0; padding: 13.5px 4px; font-size: 14px; font-weight: 400; cursor: pointer;
  }
  .pickArea {
    flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 10px; border: 1px dashed var(--border); background: var(--bg2); cursor: pointer;
    padding: 20px; text-align: center;
  }
  .pickArea .hint { font-size: 14px; color: var(--text2); flex: 0 0 auto; }
  .pickArea .filename { font-size: 14px; color: var(--text); word-break: break-all; padding: 0 10px; flex: 0 0 auto; }
  .pickArea img.thumb { max-width: 100%; max-height: 100%; min-height: 0; object-fit: contain; flex: 1; }
  .pickArea svg { color: var(--text3); flex: 0 0 auto; }
  input[type="file"] { display: none; }
  #addBtn {
    background: var(--active); color: var(--active-on); border: none; border-radius: 0;
    padding: 16.5px 11px; font-size: 22.5px; font-weight: 500; cursor: pointer; flex: 0 0 auto;
  }
  #addBtn:disabled { opacity: 0.5; cursor: default; }
  #bottomRow { display: flex; align-items: center; gap: 10px; flex: 0 0 auto; }
  #status { font-size: 13px; min-height: 16px; flex: 1; }
  #status.ok { color: var(--green); }
  #status.err { color: var(--red); }
  #settings { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
  #settings[hidden] { display: none; }
  #settings label { font-size: 12px; color: var(--text2); }
  #settings input {
    width: 100%; border: 1px solid var(--border); border-radius: 0;
    padding: 8px 10px; font-size: 14px; background: var(--bg2); color: var(--text);
    font-family: inherit;
  }
  #settings .row { display: flex; flex-direction: column; gap: 3px; }
  #saveSettingsBtn {
    background: var(--accent); border: none; color: white;
    border-radius: 0; padding: 12px 8px; font-size: 19.5px; font-weight: 500; cursor: pointer;
  }
</style>
</head>
<body>
<header>
  <h1>PaperNote</h1>
  <button id="cancelBtn" class="iconBtn" title="Clear">
    <svg width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="18" y1="6" x2="6" y2="18"/>
      <line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>
</header>
<main id="main">
  <div id="modeTabs">
    <button id="tabFile" class="on" data-mode="file">File</button>
    <button id="tabText" data-mode="text">Text</button>
  </div>
  <div id="panels">
    <div class="panel" id="panelText" hidden>
      <textarea id="textInput" placeholder="Note&#8230;"></textarea>
    </div>
    <div class="panel" id="panelFile">
      <div class="pickArea" id="filePick">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
        <div class="hint" id="fileHint">Tap to add a photo or document</div>
        <img class="thumb" id="fileThumb" hidden>
        <div class="filename" id="fileFilename"></div>
      </div>
      <button type="button" id="pasteBtn">Paste from clipboard</button>
      <input type="text" id="fileNoteInput" placeholder="Add a note&#8230;" autocomplete="off">
      <input type="file" id="fileInput">
    </div>
  </div>
  <button id="addBtn" disabled>Send</button>
  <div id="bottomRow">
    <button id="gearBtn" class="iconBtn" title="Settings">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82A1.65 1.65 0 0 0 3 13.09H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
    <div id="status"></div>
  </div>
</main>
<div id="settings" hidden>
  <div class="row">
    <label for="patInput">GitHub token (fine-grained PAT, Contents: Read and write)</label>
    <input id="patInput" type="password" placeholder="ghp_..." autocomplete="new-password">
  </div>
  <div class="row">
    <label for="ownerInput">Owner</label>
    <input id="ownerInput" type="text" autocomplete="off">
  </div>
  <div class="row">
    <label for="repoInput">Repo</label>
    <input id="repoInput" type="text" autocomplete="off">
  </div>
  <div class="row">
    <label for="nameInput">Your name (optional, shown on your captures)</label>
    <input id="nameInput" type="text" placeholder="Ron or Kelly" autocomplete="off">
  </div>
  <button id="saveSettingsBtn">Save</button>
</div>

<script>
(function () {
  "use strict";

  var CONFIG_KEY = "paperNoteGithubConfig";
  var INBOX_PATH = "inbox.json";
  var DEFAULT_OWNER = "RonSIll";
  var DEFAULT_REPO = "papernote-data";
  var MAX_COMMIT_ATTEMPTS = 3;

  var el = {
    main: document.getElementById("main"),
    gearBtn: document.getElementById("gearBtn"),
    cancelBtn: document.getElementById("cancelBtn"),
    settings: document.getElementById("settings"),
    patInput: document.getElementById("patInput"),
    ownerInput: document.getElementById("ownerInput"),
    repoInput: document.getElementById("repoInput"),
    nameInput: document.getElementById("nameInput"),
    saveSettingsBtn: document.getElementById("saveSettingsBtn"),
    modeTabs: document.getElementById("modeTabs"),
    panelText: document.getElementById("panelText"),
    panelFile: document.getElementById("panelFile"),
    textInput: document.getElementById("textInput"),
    filePick: document.getElementById("filePick"),
    fileInput: document.getElementById("fileInput"),
    fileThumb: document.getElementById("fileThumb"),
    fileHint: document.getElementById("fileHint"),
    fileFilename: document.getElementById("fileFilename"),
    fileNoteInput: document.getElementById("fileNoteInput"),
    pasteBtn: document.getElementById("pasteBtn"),
    addBtn: document.getElementById("addBtn"),
    status: document.getElementById("status")
  };

  var gh = null;
  var mode = "file";
  var pickedFile = null; // File object for file mode (photo or document, classified by MIME type at send time)

  // ---------- config ----------

  function loadConfig() {
    try {
      var raw = localStorage.getItem(CONFIG_KEY);
      gh = raw ? JSON.parse(raw) : null;
    } catch (e) { gh = null; }
  }

  function saveConfig() {
    localStorage.setItem(CONFIG_KEY, JSON.stringify(gh));
  }

  function openSettings() {
    el.patInput.value = gh && gh.pat ? gh.pat : "";
    el.ownerInput.value = (gh && gh.owner) || DEFAULT_OWNER;
    el.repoInput.value = (gh && gh.repo) || DEFAULT_REPO;
    el.nameInput.value = (gh && gh.name) || "";
    el.settings.hidden = false;
    el.main.hidden = true;
  }
  function closeSettings() {
    el.settings.hidden = true;
    el.main.hidden = false;
  }

  el.gearBtn.addEventListener("click", function () {
    openSettings();
  });

  el.cancelBtn.addEventListener("click", function () {
    if (!el.settings.hidden) {
      closeSettings();
      return;
    }
    resetCapture();
    setStatus("", "");
  });

  el.saveSettingsBtn.addEventListener("click", function () {
    var pat = el.patInput.value.trim();
    var owner = el.ownerInput.value.trim() || DEFAULT_OWNER;
    var repo = el.repoInput.value.trim() || DEFAULT_REPO;
    var name = el.nameInput.value.trim();
    if (!pat) {
      setStatus("Token is required.", "err");
      return;
    }
    gh = { pat: pat, owner: owner, repo: repo, name: name };
    saveConfig();
    closeSettings();
    setStatus("Settings saved.", "ok");
  });

  // ---------- helpers ----------

  function uid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return "n-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function b64decode(str) {
    return decodeURIComponent(escape(atob(str)));
  }

  function sanitizeFilename(name) {
    var cleaned = String(name || "").replace(/[\\/:*?"<>|\x00-\x1f]/g, "").trim();
    if (cleaned.length > 120) cleaned = cleaned.slice(0, 120);
    return cleaned || "untitled";
  }

  function guessTextFilename(text) {
    var lines = text.split("\n").map(function (l) { return l.trim(); }).filter(function (l) { return l.length > 0; });
    var firstLine = lines[0] || "note";
    var words = firstLine.split(/\s+/).filter(function (w) { return w.length > 0; });
    var truncated = words.slice(0, 10).join(" ");
    var name = sanitizeFilename(truncated).replace(/\.+$/, "");
    if (!/\.[a-zA-Z0-9]{1,8}$/.test(name)) name += ".md";
    return name;
  }

  function fileFilenameFor(file, note) {
    var extMatch = /\.[a-zA-Z0-9]{1,8}$/.exec(file.name);
    var ext = extMatch ? extMatch[0] : "";
    var trimmedNote = (note || "").trim();
    if (!trimmedNote) return sanitizeFilename(file.name);
    var base = sanitizeFilename(trimmedNote).replace(/\.+$/, "");
    return (base || "untitled") + ext;
  }

  var statusTimer = null;
  function setStatus(msg, cls, autoDismissMs) {
    if (statusTimer) { clearTimeout(statusTimer); statusTimer = null; }
    el.status.textContent = msg;
    el.status.className = cls || "";
    if (autoDismissMs) {
      statusTimer = setTimeout(function () {
        el.status.textContent = "";
        el.status.className = "";
        statusTimer = null;
      }, autoDismissMs);
    }
  }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () {
        var dataUrl = reader.result;
        resolve(dataUrl.slice(dataUrl.indexOf(",") + 1));
      };
      reader.onerror = function () { reject(new Error("Could not read file.")); };
      reader.readAsDataURL(file);
    });
  }

  // ---------- mode switching ----------

  function setMode(next) {
    mode = next;
    var buttons = el.modeTabs.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("on", buttons[i].dataset.mode === next);
    }
    el.panelText.hidden = next !== "text";
    el.panelFile.hidden = next !== "file";
    updateSendEnabled();
  }

  el.modeTabs.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-mode]");
    if (!btn) return;
    setMode(btn.dataset.mode);
  });

  // Swipe between File and Text, iOS-style. Only acts on a fast, mostly
  // horizontal gesture (small time window, |dx| clearly bigger than |dy|),
  // so it doesn't fire on ordinary taps or on the slower drag iOS uses for
  // in-field text selection. Direction matches the tabs' left-to-right
  // order (File left, Text right, per the 2026-07-31 tab reorder) — swipe
  // left moves to the tab on the right, swipe right moves to the tab on
  // the left.
  var touchStartX = null, touchStartY = null, touchStartTime = 0;
  document.addEventListener("touchstart", function (e) {
    if (!e.touches || e.touches.length !== 1) return;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchStartTime = Date.now();
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (touchStartX === null || !el.settings.hidden) { touchStartX = null; return; }
    var touch = e.changedTouches && e.changedTouches[0];
    var dx = touch ? touch.clientX - touchStartX : 0;
    var dy = touch ? touch.clientY - touchStartY : 0;
    var dt = Date.now() - touchStartTime;
    touchStartX = null;
    if (!touch || dt > 600 || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)) return;
    if (dx < 0 && mode === "file") setMode("text");
    else if (dx > 0 && mode === "text") setMode("file");
  }, { passive: true });

  function updateSendEnabled() {
    var ready = false;
    if (mode === "text") ready = el.textInput.value.trim().length > 0;
    else ready = !!pickedFile;
    el.addBtn.disabled = !ready;
  }

  el.textInput.addEventListener("input", updateSendEnabled);

  el.filePick.addEventListener("click", function () { el.fileInput.click(); });
  function adoptPickedFile(file) {
    pickedFile = file;
    el.fileFilename.textContent = file.name || "pasted file";
    el.fileHint.hidden = true;
    if (file.type && file.type.indexOf("image/") === 0) {
      var url = URL.createObjectURL(file);
      el.fileThumb.src = url;
      el.fileThumb.hidden = false;
    } else {
      el.fileThumb.hidden = true;
    }
    updateSendEnabled();
  }

  el.fileInput.addEventListener("change", function () {
    var file = el.fileInput.files[0];
    if (!file) return;
    adoptPickedFile(file);
  });

  // Lets a photo/document be pasted (Ctrl+V, or iOS's long-press Paste menu)
  // straight into the File tab instead of requiring the file picker. Only
  // intercepts when the clipboard actually holds a file — plain-text paste
  // into the textarea or any input is left completely alone.
  document.addEventListener("paste", function (e) {
    if (!el.settings.hidden) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    var fileItem = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file") { fileItem = items[i]; break; }
    }
    if (!fileItem) return;
    var file = fileItem.getAsFile();
    if (!file) return;
    e.preventDefault();
    setMode("file");
    adoptPickedFile(file);
  });

  // Maps a clipboard MIME type to a reasonable file extension. Known-type
  // lookup first, since a MIME subtype doesn't always make a sane extension
  // on its own (Office formats especially); otherwise fall back to the
  // subtype itself, stripped of "x-"/"vnd.*." prefixes some browsers add.
  function extensionForMime(mime) {
    var known = {
      "application/pdf": "pdf",
      "application/msword": "doc",
      "application/vnd.openxmlformats-officedocument.wordprocessingml.document": "docx",
      "application/vnd.ms-excel": "xls",
      "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet": "xlsx",
      "application/vnd.ms-powerpoint": "ppt",
      "application/vnd.openxmlformats-officedocument.presentationml.presentation": "pptx",
      "video/quicktime": "mov",
      "video/x-msvideo": "avi",
      "video/x-matroska": "mkv"
    };
    if (known[mime]) return known[mime];
    var sub = (mime.split("/")[1] || "bin").split(";")[0];
    sub = sub.replace(/^x-/, "").replace(/^vnd\.[^.]*\.?/, "");
    return (sub && sub.length <= 6) ? sub : "bin";
  }

  // Explicit button, not just the paste event above — iOS's long-press
  // "Paste" menu only appears on editable text elements, not the picker
  // area, and its support for delivering file data through the paste
  // event has been inconsistent across iOS versions. Reading the
  // clipboard directly via a tapped button sidesteps both problems.
  //
  // Accepts the first non-text clipboard item (images, documents, videos —
  // whatever the browser exposes), not just images. Note this is bounded by
  // what browsers actually put on the Clipboard API in the first place: a
  // plain file copy in Windows Explorer (Ctrl+C on a PDF, say) generally
  // isn't exposed to web pages at all, regardless of this filter — that
  // still needs the tap-to-browse picker below, which has no type
  // restriction and reads real files directly from disk.
  el.pasteBtn.addEventListener("click", function () {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      setStatus("Clipboard paste isn't supported in this browser.", "err");
      return;
    }
    navigator.clipboard.read().then(function (items) {
      var pasteType = null;
      var matchedItem = null;
      for (var i = 0; i < items.length && !pasteType; i++) {
        var found = items[i].types.filter(function (t) { return t.indexOf("text/") !== 0; })[0];
        if (found) { pasteType = found; matchedItem = items[i]; }
      }
      if (!matchedItem) throw new Error("Nothing to paste — copy an image, document, or video first, then try again.");
      return matchedItem.getType(pasteType).then(function (blob) {
        var ext = extensionForMime(pasteType);
        var base = pasteType.indexOf("image/") === 0 ? "pasted-image"
          : pasteType.indexOf("video/") === 0 ? "pasted-video"
          : "pasted-file";
        adoptPickedFile(new File([blob], base + "." + ext, { type: pasteType }));
        setStatus("Pasted from clipboard.", "ok");
      });
    }).catch(function (err) {
      if (err.name === "NotAllowedError") {
        setStatus("Nothing to paste — copy an image, document, or video first, then try again.", "err", 5000);
      } else {
        setStatus(err.message || "Couldn't paste from clipboard.", "err", 5000);
      }
    });
  });

  function resetCapture() {
    el.textInput.value = "";
    pickedFile = null;
    el.fileInput.value = "";
    el.fileNoteInput.value = "";
    el.fileFilename.textContent = "";
    el.fileThumb.hidden = true;
    el.fileHint.hidden = false;
    updateSendEnabled();
  }

  // ---------- GitHub commit flow ----------
  // Photos/documents can exceed the Contents API's 1MB inline limit, so every
  // send goes through the Git Data API (blob + tree + commit + ref update),
  // which has no such limit and lets the inbox.json update and the new file
  // land in the same atomic commit.

  function ghHeaders(extra) {
    var h = { Authorization: "token " + gh.pat, Accept: "application/vnd.github+json" };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }

  function apiBase() {
    return "https://api.github.com/repos/" + gh.owner + "/" + gh.repo;
  }

  function ghJson(url, options) {
    return fetch(url, options).then(function (res) {
      if (!res.ok) {
        return res.json().catch(function () { return {}; }).then(function (body) {
          var err = new Error((body && body.message) || ("GitHub didn't accept that request (status " + res.status + ")."));
          err.status = res.status;
          throw err;
        });
      }
      return res.json();
    });
  }

  function getDefaultBranch() {
    return ghJson(apiBase(), { headers: ghHeaders() }).then(function (json) { return json.default_branch; });
  }

  function createBlob(base64Content) {
    return ghJson(apiBase() + "/git/blobs", {
      method: "POST",
      headers: ghHeaders({ "Content-Type": "application/json" }),
      body: JSON.stringify({ content: base64Content, encoding: "base64" })
    }).then(function (json) { return json.sha; });
  }

  // Reads inbox.json's current entries straight out of a specific tree via
  // the Git Data API (tree -> blob), rather than the Contents API's
  // ?ref=branch endpoint. The Contents API can lag a few seconds behind a
  // just-landed commit; attemptCommit already reads the latest commit SHA
  // through the always-fresh git/refs endpoint, so a laggy Contents API
  // read of inbox.json let a commit be built whose base tree and whose
  // inbox.json content came from two different moments in history — the
  // new commit was a valid fast-forward (so nothing caught it), but its
  // inbox.json silently reverted to the older entry list, orphaning
  // whatever capture had landed in between. Reading the blob directly out
  // of the same tree used as base_tree makes that divergence impossible.
  // Checks that a parsed inbox.json has the shape both apps expect, so a
  // damaged or hand-edited file fails loudly and in plain language instead
  // of quietly breaking something downstream (a crash, or — worst case — a
  // write that further corrupts it).
  function validateInboxData(data) {
    var ok = data && typeof data === "object" && Array.isArray(data.entries);
    if (ok) {
      for (var i = 0; i < data.entries.length; i++) {
        var e = data.entries[i];
        if (!e || typeof e.id !== "string" ||
            ["text", "photo", "document"].indexOf(e.type) === -1 ||
            typeof e.filename !== "string") {
          ok = false;
          break;
        }
      }
    }
    if (!ok) {
      throw new Error("The shared notes file (inbox.json) looks damaged — its contents aren't what PaperNote expects. Nothing was sent. This needs someone to look at papernote-data/inbox.json directly before continuing.");
    }
    return data;
  }

  function getInboxDataFromTree(treeSha) {
    return ghJson(apiBase() + "/git/trees/" + treeSha, { headers: ghHeaders() })
      .then(function (treeJson) {
        var entry = (treeJson.tree || []).filter(function (e) { return e.path === INBOX_PATH; })[0];
        if (!entry) return { entries: [] };
        return ghJson(apiBase() + "/git/blobs/" + entry.sha, { headers: ghHeaders() })
          .then(function (blobJson) {
            var data = JSON.parse(b64decode(blobJson.content.replace(/\n/g, "")));
            data.entries = data.entries || [];
            return validateInboxData(data);
          });
      });
  }

  function attemptCommit(entry, blobSha, blobPath, attempt) {
    var branch, commitSha;
    return getDefaultBranch()
      .then(function (b) {
        branch = b;
        return ghJson(apiBase() + "/git/refs/heads/" + branch, { headers: ghHeaders() });
      })
      .then(function (refJson) {
        commitSha = refJson.object.sha;
        return ghJson(apiBase() + "/git/commits/" + commitSha, { headers: ghHeaders() });
      })
      .then(function (commitJson) {
        return getInboxDataFromTree(commitJson.tree.sha).then(function (data) {
          data.entries.push(entry);
          var treeEntries = [
            { path: INBOX_PATH, mode: "100644", type: "blob", content: JSON.stringify(data, null, 2) }
          ];
          if (blobSha) {
            treeEntries.push({ path: blobPath, mode: "100644", type: "blob", sha: blobSha });
          }
          return ghJson(apiBase() + "/git/trees", {
            method: "POST",
            headers: ghHeaders({ "Content-Type": "application/json" }),
            body: JSON.stringify({ base_tree: commitJson.tree.sha, tree: treeEntries })
          }).then(function (treeJson) {
            return ghJson(apiBase() + "/git/commits", {
              method: "POST",
              headers: ghHeaders({ "Content-Type": "application/json" }),
              body: JSON.stringify({
                message: "PaperNote capture: " + entry.filename,
                tree: treeJson.sha,
                parents: [commitSha]
              })
            });
          });
        });
      })
      .then(function (newCommitJson) {
        return fetch(apiBase() + "/git/refs/heads/" + branch, {
          method: "PATCH",
          headers: ghHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify({ sha: newCommitJson.sha })
        });
      })
      .then(function (res) {
        if (res.ok) return;
        if (attempt < MAX_COMMIT_ATTEMPTS) {
          return attemptCommit(entry, blobSha, blobPath, attempt + 1);
        }
        throw new Error("Couldn't save — someone else may have saved to the shared inbox at the same moment. Wait a few seconds and try again.");
      });
  }

  function submit() {
    if (!gh || !gh.pat) {
      setStatus("Set up your GitHub token first.", "err");
      openSettings();
      return;
    }

    var entry = {
      id: uid(),
      type: null,
      filename: null,
      textContent: null,
      blobPath: null,
      mimeType: null,
      capturedBy: gh.name || null,
      capturedAt: new Date().toISOString()
    };

    var blobPromise;
    var blobPath = null;

    if (mode === "text") {
      var text = el.textInput.value.trim();
      if (!text) return;
      entry.type = "text";
      entry.filename = guessTextFilename(text);
      entry.textContent = text;
      blobPromise = Promise.resolve(null);
    } else {
      if (!pickedFile) return;
      // The File tab covers both photos and documents; classify by MIME type
      // so the inbox entry still distinguishes them for PaperFile.
      entry.type = pickedFile.type && pickedFile.type.indexOf("image/") === 0 ? "photo" : "document";
      entry.filename = fileFilenameFor(pickedFile, el.fileNoteInput.value);
      entry.mimeType = pickedFile.type || null;
      blobPath = "files/" + entry.id + "__" + entry.filename;
      entry.blobPath = blobPath;
      blobPromise = fileToBase64(pickedFile).then(createBlob);
    }

    el.addBtn.disabled = true;
    setStatus("Sending…");

    blobPromise
      .then(function (blobSha) { return attemptCommit(entry, blobSha, blobPath, 1); })
      .then(function () {
        setStatus("Sent.", "ok");
        resetCapture();
      })
      .catch(function (err) {
        setStatus(err.message || "Couldn't send — check your connection or token in Settings.", "err");
        console.error(err);
        updateSendEnabled();
      });
  }

  el.addBtn.addEventListener("click", submit);

  loadConfig();
  if (!gh || !gh.pat) {
    openSettings();
  }
  updateSendEnabled();
})();
</script>
</body>
</html>
